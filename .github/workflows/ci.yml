name: CI — Testing Unitario

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Ejecutar pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas con Maven
        run: mvn -B test
        working-directory: orderflow-starter

      - name: Construir imagen Docker con SHA del commit
        run: |
          docker build -t orders-api:${{ github.sha }} -t 44.210.219.240:8082/orders-api:${{ github.sha }} .
